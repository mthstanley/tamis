[project]
name = "tamis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matthew Stanley", email = "stanley.t.matthew@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imutils>=0.5.4",
    "ollama>=0.6.3",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.13.5",
    "pytesseract>=0.3.13",
    "typer>=0.27.2",
]

[project.scripts]
tamis = "tamis.main:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
